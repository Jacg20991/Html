<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de administración</title>
    <script
      src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind-config-admin.js"></script>
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="dark bg-background text-on-surface font-sans antialiased">
    <!-- Estructura del panel. Su comportamiento esta en js/admin.js. -->
    <main class="mx-auto max-w-2xl px-6 py-16">
      <div id="loginCard"
        class="rounded-2xl border border-outline-variant bg-surface-container-low p-6 shadow-sm">
        <div class="mb-6 flex items-center gap-3">
          <img src="/img/admin.png?v=admin-white-2026" alt="Admin"
            class="h-12 w-12 object-contain" />
          <div>
            <p
              class="text-xs uppercase tracking-[0.2em] text-secondary">Acceso</p>
            <h1
              class="text-2xl font-bold text-on-surface">Panel de administrador</h1>
          </div>
        </div>

        <div class="space-y-4">
          <label for="adminKey"
            class="block text-sm font-medium text-on-surface">Clave de propietario</label>
          <input id="adminKey" type="password" placeholder="Introduce la clave"
            class="w-full rounded-md border border-outline-variant bg-surface px-3 py-2 text-sm text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/30" />

          <button id="adminAccessButton" type="button"
            class="w-full rounded-md bg-primary px-4 py-2 text-sm font-semibold text-white">Entrar</button>
        </div>

        <div id="adminStatus"
          class="mt-4 hidden rounded-md border px-3 py-2 text-sm"></div>
      </div>

      <div id="adminSettings"
        class="mt-6 hidden rounded-2xl border border-outline-variant bg-surface-container-low p-6 shadow-sm">
        <div class="mb-6">
          <p
            class="text-xs uppercase tracking-[0.2em] text-secondary">Configuración</p>
          <h2
            class="mt-2 text-xl font-bold text-on-surface">Gestión del sitio</h2>
        </div>

        <div class="space-y-6">
          <label
            class="flex cursor-pointer items-center justify-between gap-4 rounded-xl border border-outline-variant bg-surface px-4 py-3">
            <div>
              <div
                class="text-sm font-semibold text-on-surface">Borrado de publicaciones</div>
              <div
                class="text-xs text-secondary">Permite o bloquea la eliminación de historias.</div>
            </div>
            <div class="relative inline-block">
              <input id="deleteToggle" type="checkbox" class="peer sr-only"
                checked />
              <span
                class="block h-7 w-12 rounded-full bg-emerald-500 transition peer-checked:bg-emerald-500 peer-checked:shadow-[0_0_12px_rgba(16,185,129,0.5)]"></span>
              <span
                class="absolute left-1 top-1 h-5 w-5 rounded-full bg-white transition peer-checked:translate-x-5"></span>
            </div>
          </label>

          <div>
            <div
              class="mb-3 text-sm font-semibold text-on-surface">Icono del juego actual</div>
            <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
              <label
                class="game-option flex cursor-pointer flex-col items-center gap-2 rounded-xl border border-outline-variant bg-surface p-2 text-center">
                <input type="radio" name="gameIcon" value="offline"
                  class="sr-only" />
                <span class="text-xs font-semibold text-red-600">Offline</span>
              </label>
              <label
                class="game-option flex cursor-pointer flex-col items-center gap-2 rounded-xl border border-outline-variant bg-surface p-2 text-center">
                <input type="radio" name="gameIcon"
                  value="/img/game/gameminecraft.png" class="sr-only" />
                <img src="/img/game/gameminecraft.png" alt="Minecraft"
                  class="h-12 w-12 object-contain opacity-90" />
                <span
                  class="text-xs font-medium text-on-surface">Minecraft</span>
              </label>
              <label
                class="game-option flex cursor-pointer flex-col items-center gap-2 rounded-xl border border-outline-variant bg-surface p-2 text-center">
                <input type="radio" name="gameIcon"
                  value="/img/game/gamezomboid.png" class="sr-only" />
                <img src="/img/game/gamezomboid.png" alt="Project Zomboid"
                  class="h-12 w-12 object-contain opacity-90" />
                <span
                  class="text-xs font-medium text-on-surface">Project Zomboid</span>
              </label>
              <label
                class="game-option flex cursor-pointer flex-col items-center gap-2 rounded-xl border border-outline-variant bg-surface p-2 text-center">
                <input type="radio" name="gameIcon"
                  value="/img/game/gamefall.png" class="sr-only" />
                <img src="/img/game/gamefall.png" alt="Fall Guys"
                  class="h-12 w-12 object-contain opacity-90" />
                <span
                  class="text-xs font-medium text-on-surface">Fall Guys</span>
              </label>
              <label
                class="game-option flex cursor-pointer flex-col items-center gap-2 rounded-xl border border-outline-variant bg-surface p-2 text-center">
                <input type="radio" name="gameIcon"
                  value="/img/game/gameleft2.png" class="sr-only" />
                <img src="/img/game/gameleft2.png" alt="Left 4 Dead 2"
                  class="h-12 w-12 object-contain opacity-90" />
                <span
                  class="text-xs font-medium text-on-surface">Left 4 Dead 2</span>
              </label>
              <label
                class="game-option flex cursor-pointer flex-col items-center gap-2 rounded-xl border border-outline-variant bg-surface p-2 text-center">
                <input type="radio" name="gameIcon"
                  value="/img/game/gameisaac.png" class="sr-only" />
                <img src="/img/game/gameisaac.png" alt="The Binding of Isaac"
                  class="h-12 w-12 object-contain opacity-90" />
                <span
                  class="text-xs font-medium text-on-surface">The Binding of Isaac</span>
              </label>
              <label
                class="game-option flex cursor-pointer flex-col items-center gap-2 rounded-xl border border-outline-variant bg-surface p-2 text-center">
                <input type="radio" name="gameIcon"
                  value="/img/game/gamerain.png" class="sr-only" />
                <img src="/img/game/gamerain.png" alt="Rain World"
                  class="h-12 w-12 object-contain opacity-90" />
                <span
                  class="text-xs font-medium text-on-surface">Rain World</span>
              </label>
              <label
                class="game-option flex cursor-pointer flex-col items-center gap-2 rounded-xl border border-outline-variant bg-surface p-2 text-center">
                <input type="radio" name="gameIcon"
                  value="/img/game/gamestarve.png" class="sr-only" />
                <img src="/img/game/gamestarve.png" alt="Don't Starve Together"
                  class="h-12 w-12 object-contain opacity-90" />
                <span
                  class="text-xs font-medium text-on-surface">Don't Starve Together</span>
              </label>
            </div>
          </div>

          <section class="border-t border-outline-variant pt-6">
            <div class="mb-4">
              <h3 class="text-sm font-semibold text-on-surface">Hero de la página principal</h3>
              <p class="mt-1 text-xs text-secondary">Los cambios se guardan en el servidor y se reflejan en el inicio.</p>
            </div>
            <div class="space-y-4">
              <div>
                <label for="heroEyebrowInput" class="mb-1 block text-xs font-medium text-secondary">Lo ma duro pa</label>
                <input id="heroEyebrowInput" type="text" maxlength="100"
                  class="w-full rounded-md border border-outline-variant bg-surface px-3 py-2 text-sm text-on-surface" />
              </div>
              <div>
                <label for="heroDescriptionInput" class="mb-1 block text-xs font-medium text-secondary">Wow Minecraft y el Dont!!!</label>
                <textarea id="heroDescriptionInput" rows="3" maxlength="500"
                  class="w-full rounded-md border border-outline-variant bg-surface px-3 py-2 text-sm text-on-surface"></textarea>
              </div>
              <button id="saveHeroButton" type="button"
                class="rounded-md bg-primary px-4 py-2 text-sm font-semibold text-white">Guardar hero</button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
